apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orders-db
  namespace: food-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-db
  template:
    metadata:
      labels:
        app: orders-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: orders
        - name: POSTGRES_USER
          value: foodapp
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quickbite-db-credentials
              key: POSTGRES_PASSWORD
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U foodapp -d orders
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U foodapp -d orders
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
  serviceName: orders-db
  volumeClaimTemplates:
  - metadata:
      name: db-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: orders-db
  namespace: food-delivery
spec:
  selector:
    app: orders-db
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
---
