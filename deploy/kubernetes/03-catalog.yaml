apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: food-delivery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
      - name: catalog
        image: quickbite/catalog:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        env: []
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /live
            port: 3001
          initialDelaySeconds: 8
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: food-delivery
spec:
  selector:
    app: catalog
  ports:
  - port: 3001
    targetPort: 3001
  type: ClusterIP
