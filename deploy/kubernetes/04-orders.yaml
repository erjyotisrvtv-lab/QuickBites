apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: food-delivery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
      - name: orders
        image: quickbite/orders:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3002
        env:
        - name: CATALOG_URL
          value: http://catalog:3001
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: quickbite-db-credentials
              key: ORDERS_DATABASE_URL
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /live
            port: 3002
          initialDelaySeconds: 8
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: food-delivery
spec:
  selector:
    app: orders
  ports:
  - port: 3002
    targetPort: 3002
  type: ClusterIP
