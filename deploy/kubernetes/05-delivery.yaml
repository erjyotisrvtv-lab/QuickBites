apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery
  namespace: food-delivery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delivery
  template:
    metadata:
      labels:
        app: delivery
    spec:
      containers:
      - name: delivery
        image: quickbite/delivery:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3003
        env:
        - name: ORDERS_URL
          value: http://orders:3002
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: quickbite-db-credentials
              key: DELIVERY_DATABASE_URL
        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /live
            port: 3003
          initialDelaySeconds: 8
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: delivery
  namespace: food-delivery
spec:
  selector:
    app: delivery
  ports:
  - port: 3003
    targetPort: 3003
  type: ClusterIP
